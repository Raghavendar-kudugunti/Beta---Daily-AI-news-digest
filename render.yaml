services:
  - type: web
    name: daily-ai-news-digest
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    dockerContext: .
    healthCheckPath: /healthz
    envVars:
      - key: MAIN_API_KEY
        sync: false
      - key: CHECKER_API_KEY
        sync: false
      - key: USE_AGENT_SEARCH
        value: "0"
